    <!--
      Ordered so each browser takes the best it understands: the .ico is the
      fallback for anything that only looks for /favicon.ico, and the SVG wins
      wherever it is supported because it stays sharp at every size.
      Regenerate all three with `npm run favicon`.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAFAFA" />

      href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&display=swap"
